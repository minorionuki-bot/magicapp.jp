<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">  <!-- 検索に載せない（あとで検索されて仕掛けが見つからないように） -->
<title>カメラ</title>
<style>
  /* iPhone の標準カメラに似せた画面。お客さんが触るので、仕掛けに関わるものは画面に出さない */
  :root { color-scheme: dark; --yellow: #ffd60a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  /* 高さは Safari のツールバーを除いた、実際に見えている高さ（100vh だと下のボタンがツールバーの裏に回った） */
  #app { position: fixed; left: 0; right: 0; top: 0; height: 100dvh; display: flex; flex-direction: column; }
  /* 上の黒い帯。長押しで演者用メニュー（お客さんには何もない場所に見える） */
  #top { flex: 0 0 auto; height: calc(env(safe-area-inset-top) + 36px); -webkit-touch-callout: none; }
  /* プレビューは 3:4 の高さを優先して取り、入りきらないときだけ縮める（はみ出した映像の端は切る）。
     余った高さは下のボタンの部分に回す（両方を伸ばすと半分ずつ分け合って、プレビューが横長になった） */
  #preview { position: relative; width: 100%; flex: 0 1 calc(100vw * 4 / 3); min-height: 0;
    overflow: hidden; background: #000; }
  /* 映像は動画の部品なので、iPhone の Safari が再生・停止のボタンを重ねて出すことがあった（低電力モードや、触れたとき）。
     ボタンは出さず、触れても反応しないようにする（タップはその下の #preview が受ける） */
  #preview video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  video::-webkit-media-controls, video::-webkit-media-controls-panel, video::-webkit-media-controls-overlay-play-button,
  video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
  #preview.mirror video { transform: scaleX(-1); }   /* 内カメラは標準のカメラと同じく鏡像で見せる */
  #flash { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .25s ease-out; }
  #flash.on { opacity: 1; transition: none; }
  /* 撮る前にカードを認識していることを知らせる枠。QRコードを読むときのような黄色の細い線 */
  #frame { position: absolute; left: 0; top: 0; border: 1.5px solid var(--yellow); border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .3s ease-out, transform .18s ease-out, width .18s ease-out, height .18s ease-out; }
  #frame.on { opacity: 1; }
  /* タップした場所に出すピント合わせの四角（標準のカメラと同じ見た目） */
  #focus { position: absolute; width: 76px; height: 76px; border: 1px solid var(--yellow); pointer-events: none;
    transform: scale(1.4); transition: transform .25s ease-out, opacity .4s ease-in; }
  #focus.settled { transform: scale(1); }
  #focus.faded { opacity: .35; }
  #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
    text-align: center; color: #aaa; font-size: 15px; line-height: 1.6; }
  #bottom { flex: 1 0 150px; display: flex; flex-direction: column; justify-content: center; gap: 18px;
    padding-bottom: env(safe-area-inset-bottom); }
  #mode { text-align: center; color: var(--yellow); font-size: 13px; font-weight: 600; letter-spacing: .04em; }
  #controls { display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
  #thumbWrap { position: relative; width: 48px; height: 48px; }
  /* サムネイルの真上（右に置くと、幅の狭い iPhone でシャッターと重なった） */
  #saveHint { position: absolute; left: -2px; bottom: 58px; white-space: nowrap;
    font-size: 13px; font-weight: 600; color: #fff; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #saveHint.on { opacity: 1; }
  #saveHint.wait { color: rgba(255,255,255,.55); }
  /* 確認画面：サムネイルを押すと、焼き込んだ写真を画面いっぱいに出して確かめてから保存する（撮り直しもできる） */
  #review { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity .2s ease-out; }
  #review.on { opacity: 1; pointer-events: auto; }
  #reviewImage { flex: 1 1 auto; min-height: 0; width: 100%; margin-top: env(safe-area-inset-top); }
  #save:disabled { opacity: .5; }
  #reviewBar { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px calc(20px + env(safe-area-inset-bottom)); }
  #reviewBar button { font: 600 17px -apple-system, sans-serif; border: 0; border-radius: 999px; padding: 12px 22px; }
  #retake { background: transparent; color: #fff; }
  #save { background: #fff; color: #000; }
  #thumb { width: 48px; height: 48px; border-radius: 8px; background: #222 center / cover no-repeat; border: 0; padding: 0; }
  #thumb.empty { visibility: hidden; }
  /* 焼き込み中：サムネイルのまわりの細い輪をゆっくり明滅させる。押せば終わったときに自動で共有画面を開く */
  #thumb { position: relative; }
  #thumb.busy::after { content: ''; position: absolute; inset: -4px; border-radius: 11px;
    border: 2px solid #fff; animation: breathe .9s ease-in-out infinite alternate; }
  @keyframes breathe { from { opacity: .15; } to { opacity: .8; } }
  /* 押せるようになった合図：軽く弾む */
  #thumb.ready { animation: pop .35s ease-out; }
  @keyframes pop { 50% { transform: scale(1.15); } }
  #shutter { width: 78px; height: 78px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 0;
    display: flex; align-items: center; justify-content: center; }
  #shutter::after { content: ""; width: 64px; height: 64px; border-radius: 50%; background: #fff; transition: transform .1s; }
  #shutter:active::after { transform: scale(.9); }
  #flip { width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255,255,255,.15); padding: 0;
    display: flex; align-items: center; justify-content: center; }
  #flip svg { width: 26px; height: 26px; }

  /* 演者用メニュー */
  #menu { position: fixed; inset: 0; background: #1c1c1e; display: none; flex-direction: column; overflow-y: auto;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); -webkit-user-select: text; user-select: text; }
  #menu.on { display: flex; }
  /* 中の欄は縮めない（縮むと記録欄が1行に押しつぶされ、メニューもスクロールできなかった。2026-10-14） */
  #menu > * { flex-shrink: 0; }
  #menu header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  #menu h1 { font-size: 17px; margin: 0; }
  #menu button.text { background: none; border: 0; color: #0a84ff; font-size: 17px; padding: 8px 0; }
  #menu h2 { font-size: 13px; font-weight: 400; color: #8e8e93; margin: 20px 4px 6px; }
  .group { background: #2c2c2e; border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: 16px; min-height: 44px; }
  .row + .row { border-top: .5px solid #3a3a3c; }
  .row.card { color: #0a84ff; }
  .row .check { color: #0a84ff; visibility: hidden; }
  .row.selected .check { visibility: visible; }
  .log { font-size: 12px; color: #8e8e93; padding: 10px 16px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  #testResult { width: 100%; border-radius: 12px; margin-top: 10px; display: none; }
  label.row { cursor: pointer; color: #0a84ff; }
  label.row input { display: none; }
</style>
</head>
<body>
<div id="review">
  <canvas id="reviewImage"></canvas>
  <div id="reviewBar">
    <button id="retake">撮り直す</button>
    <button id="save">保存</button>
  </div>
</div>
<div id="app">
  <div id="top"></div>
  <div id="preview">
    <video id="video" playsinline muted autoplay disablepictureinpicture disableremoteplayback></video>
    <div id="frame"></div>
    <div id="flash"></div>
    <div id="message"></div>
  </div>
  <div id="bottom">
    <div id="mode">写真</div>
    <div id="controls">
      <div id="thumbWrap">
        <button id="thumb" class="empty" aria-label="直前の写真"></button>
        <!-- 保存の案内（何を押せばいいかを文字で出す。2026-10-14） -->
        <div id="saveHint"></div>
      </div>
      <button id="shutter" aria-label="シャッター"></button>
      <button id="flip" aria-label="カメラを切り替え">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12a8 8 0 0 1 13.66-5.66L20 8.5"/><path d="M20 4v4.5h-4.5"/>
          <path d="M20 12a8 8 0 0 1-13.66 5.66L4 15.5"/><path d="M4 20v-4.5h4.5"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div id="menu">
  <header><h1>演者用</h1><button class="text" id="closeMenu">閉じる</button></header>
  <h2>直前の撮影</h2>
  <div class="group"><div class="log" id="log">まだ撮影していません</div></div>
  <h2>変化させるカード</h2>
  <div class="group" id="cards"></div>
  <h2>調整用</h2>
  <div class="group">
    <label class="row">写真を選んで試す<input type="file" id="testFile" accept="image/*"></label>
  </div>
  <img id="testResult" alt="">
</div>

<script type="module" src="./app.js?v=20261015111605"></script>
</body>
</html>
